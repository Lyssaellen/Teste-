<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENAI - Entrar</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="geral.css">
</head>
<body>

  <div class="auth-card">
    <!-- Banner Esquerdo -->
    <div class="auth-banner">
        <div class="brand">
            <div class="brand-logo">
                <img src="img/senai.jpg" alt="SENAI">
            </div>
            <div class="brand-info">
                <span class="brand-title">Biblioteca ADM</span>
                <span class="brand-sub">Painel do Aluno</span>
            </div>
        </div>

        <div class="banner-content">
            <h1>Bem-vindo!</h1>
            <p>Faça login para acessar a pagina da biblioteca.</p>
        </div>

        <div class="security-badge">
            <i data-lucide="shield-check"></i>
            <span>Seus dados estão protegidos com segurança.</span>
        </div>
    </div>

    <!-- Formulário Direito -->
    <div class="auth-form-container">
      <h2>Entrar</h2>
      <p class="subtitle">Informe suas credenciais para continuar.</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-icon-wrapper">
            <i data-lucide="mail" class="field-icon"></i>
            <input type="email" id="email" placeholder="Digite seu email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-icon-wrapper">
            <i data-lucide="lock" class="field-icon"></i>
            <input type="password" id="password" placeholder="Digite sua senha" required>
            <i data-lucide="eye" class="toggle-password" onclick="togglePasswordVisibility('password', this)"></i>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="remember">
            <span class="checkmark"></span>
            Lembrar-me
          </label>
          <a href="recuperar-senha.html" class="forgot-link">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn-primary">
          <i data-lucide="log-in"></i>
          Entrar
        </button>
      </form>

      <div class="divider">
        <span>ou</span>
      </div>

      <p class="switch-auth">
        Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
      </p>
    </div>
  </div>

  <script src="geral.js"></script>
</body>
</html>
