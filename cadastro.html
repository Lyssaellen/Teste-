<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENAI - Cadastro do Aluno</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="geral.css">
</head>
<body>

  <div class="auth-card">
    <!-- Banner Esquerdo -->
    <div class="auth-banner">
        <div class="brand">
            <div class="brand-logo">
                <img src="img/senai.jpg" alt="SENAI">
            </div>
            <div class="brand-info">
                <span class="brand-title">Biblioteca ADM</span>
                <span class="brand-sub">Painel do Aluno</span>
            </div>
        </div>

        <div class="banner-content">
            <h1>Criar conta</h1>
            <p>Preencha os dados abaixo para criar sua conta.</p>
        </div>

        <div class="security-badge">
            <i data-lucide="shield-check"></i>
            <span>Seus dados estão protegidos com segurança.</span>
        </div>
    </div> <!-- O fechamento da .auth-banner DEVE ficar AQUI -->

    <!-- Formulário Direito -->
    <div class="auth-form-container">
      <h2>Cadastro do Aluno</h2>
      <p class="subtitle">Todos os campos são obrigatórios.</p>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="fullName">Nome completo</label>
            <div class="input-icon-wrapper">
              <i data-lucide="user" class="field-icon"></i>
              <input type="text" id="fullName" placeholder="Digite seu nome completo" required>
            </div>
          </div>

          <div class="form-group">
            <label for="regEmail">Email</label>
            <div class="input-icon-wrapper">
              <i data-lucide="mail" class="field-icon"></i>
              <input type="email" id="regEmail" placeholder="Digite seu e-mail" required>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone">Contato</label>
            <div class="input-icon-wrapper">
              <i data-lucide="phone" class="field-icon"></i>
              <input type="tel" id="phone" placeholder="(11) 99999-9999" required>
            </div>
          </div>

          <div class="form-group">
            <label for="role">Turma/ Curso</label>
            <div class="input-icon-wrapper">
              <i data-lucide="briefcase" class="field-icon"></i>
              <input type="text" id="role" placeholder="Ex.: Qualidade" required>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="regPassword">Crie uma senha</label>
          <div class="input-icon-wrapper">
            <i data-lucide="lock" class="field-icon"></i>
            <input type="password" id="regPassword" placeholder="Mínimo de 8 caracteres" minlength="8" required>
            <i data-lucide="eye" class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirme sua senha</label>
          <div class="input-icon-wrapper">
            <i data-lucide="lock" class="field-icon"></i>
            <input type="password" id="confirmPassword" placeholder="Digite novamente sua senha" minlength="8" required>
            <i data-lucide="eye" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)"></i>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="terms" required>
            <span class="checkmark"></span>
            Eu concordo com os <a href="#" class="inline-link">Termos de Uso</a> e <a href="#" class="inline-link">Política de Privacidade</a>.
          </label>
        </div>

        <button type="submit" class="btn-primary">
          <i data-lucide="send"></i>
          Cadastrar
        </button>
      </form>

      <p class="switch-auth" style="margin-top: 16px;">
        Já tem uma conta? <a href="login.html">Faça login</a>
      </p>
    </div>
  </div>

  <script src="geral.js"></script>
</body>
</html>
